<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Invitación</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Formulario oculto para que Netlify Forms detecte los campos. Si cambias netlifyFormName en event.config.json, cámbialo aquí también. -->
    <form name="rsvp" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <input type="text" name="extra" />
      <input type="checkbox" name="regalo" />
      <input type="hidden" name="voto" />
      <input type="hidden" name="espectro" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
